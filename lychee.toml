# Config for the lychee link checker (docs/**/*.md).
# See: https://lychee.cli.rs/usage/config/

# Be patient with slow sites and transient failures before reporting a broken link.
# (Bumped from 30s/3 retries after two separate CI runs saw transient network
# errors -- timeout, then connection-reset -- against sites that load fine when
# checked manually. Looks like runner-side flakiness, not dead links.)
timeout = 45
retry_wait_time = 8
max_retries = 5

# Some sites return 429 (rate limited) to automated checkers under normal load —
# treat it as non-fatal rather than a broken link.
accept = ["200..=299", "429"]

# mailto: links in the book (none expected, but harmless to allow) and
# localhost references some snippets use as a generic placeholder.
#
# The domains below return 200 to a normal browser but fail from lychee's CI
# environment (bot-blocking or IP-range blocking, confirmed manually — not
# actually broken). Excluded rather than retried, since retries don't help.
#
# airbyte.com failed 3 separate CI runs with 3 different network-level errors
# (timeout, connection-reset, connection-failed) despite loading fine outside
# CI, even after raising timeout/retries above — looks like it blocks the
# GitHub Actions runner IP range outright, so retrying doesn't help here either.
exclude = [
  "^mailto:",
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://(www\\.)?trustradius\\.com/",
  "^https?://docs\\.redhat\\.com/",
  "^https?://developers\\.redhat\\.com/",
  "^https?://(www\\.)?airbyte\\.com/",
]
