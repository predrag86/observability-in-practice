# Config for the lychee link checker (docs/**/*.md).
# See: https://lychee.cli.rs/usage/config/

# Be patient with slow sites and transient failures before reporting a broken link.
timeout = 30
retry_wait_time = 5
max_retries = 3

# Some sites return 429 (rate limited) to automated checkers under normal load —
# treat it as non-fatal rather than a broken link.
accept = ["200..=299", "429"]

# mailto: links in the book (none expected, but harmless to allow) and
# localhost references some snippets use as a generic placeholder.
exclude = [
  "^mailto:",
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
]
