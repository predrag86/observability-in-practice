site_name: Observability u praksi
site_description: OpenTelemetry i Grafana LGTM stack — knjiga zasnovana na stvarnoj produkcionoj implementaciji
repo_url: https://github.com/predrag86/observability-in-practice
repo_name: observability-in-practice
edit_uri: edit/main/docs/

theme:
  name: material
  language: sr
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Prebaci na tamni režim
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Prebaci na svetli režim
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

hooks:
  - hooks/latin_dates.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: sr
          default: true
          name: Srpski
          build: true
          site_name: "Observability u praksi"
          theme:
            language: custom
        - locale: en
          name: English
          build: true
          site_name: "Observability in Practice"
          theme:
            language: en
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

nav:
  - Naslovna: index.md
  - Uvod: uvod.md
  - "Deo I — Osnove":
      - deo-1-uvod.md
      - poglavlje-01-sta-je-observability.md
      - poglavlje-02-opentelemetry.md
      - poglavlje-03-izbor-platforme.md
  - "Deo II — Arhitektura prikupljanja telemetrije":
      - deo-2-uvod.md
      - poglavlje-04-gateway.md
      - poglavlje-05-instrumentacija.md
      - poglavlje-06-sidecar.md
      - poglavlje-07-pull-obrasci.md
      - poglavlje-08-frontend-rum.md
      - poglavlje-09-sinteticko-pracenje.md
  - "Deo III — Obrada, kardinalnost i troškovi":
      - deo-3-uvod.md
      - poglavlje-10-anatomija-pipeline.md
      - poglavlje-11-kardinalnost-cena.md
      - poglavlje-12-sampling-trejsova.md
  - "Deo IV — Alarmiranje, SLO i odgovor na incidente":
      - deo-4-uvod.md
      - poglavlje-13-arhitektura-alarmiranja.md
      - poglavlje-14-kad-alarm-cuti.md
      - poglavlje-15-slo-budzet-greske.md
      - poglavlje-16-runbook-ovi.md
      - poglavlje-17-postmortem-kultura.md
  - "Deo V — Observability po domenima":
